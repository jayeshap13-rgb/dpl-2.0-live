<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diorite Premier League 2.0</title>
    <meta name="description" content="Diorite Premier League 2.0 live scoreboard, results, stats, awards, points table, and admin match center." />
    <meta name="theme-color" content="#0a0713" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#home" data-route="home" aria-label="Diorite Premier League home">
        <span class="brand-mark"><img src="./assets/dpl-logo-main.png" alt="" /></span>
        <span>
          <strong>Diorite Premier League</strong>
          <small>Season 2.0</small>
        </span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">Menu</button>
      <nav class="nav" id="mainNav">
        <a href="#home" data-route="home">Home</a>
        <a href="#dashboard" data-route="dashboard">Live</a>
        <a href="#results" data-route="results">Results</a>
        <a href="#stats" data-route="stats">Stats</a>
        <a href="#points" data-route="points">Points</a>
        <a href="#admin" data-route="admin">Admin</a>
      </nav>
    </header>

    <main id="app"></main>

    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-panel">
        <button class="icon-btn close-modal" id="closeModal" aria-label="Close">x</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <template id="toastTemplate">
      <div class="toast"></div>
    </template>
    <div class="toast-stack" id="toastStack"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
